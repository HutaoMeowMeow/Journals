name: Build and Upload iOS App

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Initialize Capacitor iOS
        run: |
          npx cap sync ios

      - name: Success
        run: echo "iOS sync and build preparation completed successfully!"