workflows:
  ios-workflow:
    name: iOS Build & Firebase Distribution
    max_build_duration: 60
    environment:
      vars:
        BUNDLE_ID: "com.journal.app"
        FIREBASE_APP_ID: "1:82648709349:ios:f934084584c5467db7bc0c"
      groups:
        - firebase_group
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Build web assets
        script: |
          npm run build --if-present
      - name: Setup Capacitor iOS with SPM
        script: |
          rm -rf ios
          npx cap add ios --packagemanager SPM
          npx cap sync ios
      - name: Build iOS Simulator App
        script: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload to Firebase App Distribution
        script: |
          npm install -g firebase-tools
          # Find the built app zip or path and upload
          APP_PATH=$(find $HOME/Library/Developer/Xcode/DerivedData -name "*.app" | head -n 1)
          echo "Found app at: $APP_PATH"
          firebase appdistribution:distribute "$APP_PATH" \
            --app "$FIREBASE_APP_ID" \
            --token "$FIREBASE_TOKEN" \
            --testers "your-email@example.com" \
            --release-notes "Automated iOS build from Codemagic!"
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app