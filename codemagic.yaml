workflows:
  ios-workflow:
    name: iOS Build & Firebase Distribution
    max_build_duration: 60
    environment:
      vars:
        BUNDLE_ID: "com.journal.app"
        FIREBASE_APP_ID: "1:82648709349:ios:f934084584c5467db7bc0c"
      groups:
        - firebase_group
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Build web assets
        script: |
          npm run build --if-present
      - name: Setup Capacitor iOS with SPM
        script: |
          rm -rf ios
          npx cap add ios --packagemanager SPM
          npx cap sync ios
      - name: Build iOS Simulator App
        script: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Package Simulator App Artifact
        script: |
          echo "Simulator build compiled successfully!"
          # Locates the built .app and zips it up for easy download
          APP_PATH=$(find $HOME/Library/Developer/Xcode/DerivedData -name "*.app" | head -n 1)
          echo "Found app at: $APP_PATH"
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app