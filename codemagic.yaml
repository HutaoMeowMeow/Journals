workflows:
  ios-workflow:
    name: iOS App Build
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: development
        bundle_identifier: com.journal.app
      vars:
        BUNDLE_ID: "com.journal.app"
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Initialize Capacitor iOS
        script: |
          npx cap sync ios
      - name: Build web assets
        script: |
          npm run build --if-present
      - name: Build iOS App (.ipa)
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release archive -archivePath $HOME/Library/Developer/Xcode/Archives/App.xcarchive CODE_SIGN_STYLE=Automatic
          xcodebuild -exportArchive -archivePath $HOME/Library/Developer/Xcode/Archives/App.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath build/
    artifacts:
      - ios/App/build/*.ipa