workflows:
  ios-workflow:
    name: iOS Build & Firebase Distribution
    max_build_duration: 60
    environment:
      vars:
        BUNDLE_ID: "com.journal.app"
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Initialize Capacitor iOS
        script: |
          npx cap sync ios
      - name: Build web assets
        script: |
          npm run build --if-present
      - name: Compile iOS Simulator App
        script: |
          cd ios/App || exit 1
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
    artifacts:
      - ios/App/build/**/*.app