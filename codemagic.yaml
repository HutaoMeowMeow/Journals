workflows:
  ios-workflow:
    name: iOS Build & Firebase Distribution
    max_build_duration: 60
    environment:
      vars:
        BUNDLE_ID: "com.journal.app"
      groups:
        - firebase_group
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Build web assets
        script: |
          npm run build --if-present
      - name: Setup Capacitor iOS with SPM
        script: |
          rm -rf ios
          npx cap add ios --packagemanager SPM
          npx cap sync ios
      - name: Build iOS Simulator App
        script: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
    publishing:
      firebase:
        firebase_token: $FIREBASE_TOKEN
        app_id: $FIREBASE_APP_ID
        testers:
          - your-email@example.com   # Change this to your tester email address
        release_notes: "Automatic deployment from Codemagic!"