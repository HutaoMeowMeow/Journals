workflows:
  ios-workflow:
    name: iOS Build & Firebase Distribution
    max_build_duration: 60
    environment:
      vars:
        BUNDLE_ID: "com.journal.app"
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Build web assets
        script: |
          npm run build --if-present
      - name: Initialize Capacitor iOS and Install Pods
        script: |
          npx cap repo-update || true
          npx cap add ios --force || true
          npx cap sync ios
          cd ios/App
          pod install
      - name: Build iOS Simulator App
        script: |
          xcodebuild build \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app